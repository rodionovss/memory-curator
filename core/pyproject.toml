[project]
name = "memory-curator"
version = "0.1.0"
description = "Self-improving knowledge base agent for AI agents"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
curator-mcp-server = "curator.server:main"
curator-worker = "curator.worker:main"
curator = "curator.control:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]